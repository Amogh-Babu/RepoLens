[project]
name = "repolens-backend"
version = "0.0.0"
description = "RepoLens API: repository ingestion, static analysis, graph store, and search."
# The minimum supported version. The Docker image and CI pin the exact
# interpreter in ../.python-version; a compatibility job also runs the suite on
# the minimum and the newest Python.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "httpx>=0.27,<1",
]

[tool.uv]
# The backend runs from source (`pythonpath` below, `--app-dir` for uvicorn);
# uv only manages its environment and lockfile, it does not build a package.
package = false
# Resolve only releases published before this date, so `uv lock` is
# reproducible and never picks up a release that is days old. Upgrading the
# locked dependencies means moving this date forward and re-running
# `uv lock` (see docs in ../README.md).
exclude-newer = "2026-10-26T00:00:00Z"

[tool.pytest.ini_options]
# Make `import repolens` work without installing the package.
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "e2e: runs the whole pipeline on the reference repository (tests/fixtures/e2e_reference)",
]
