[project]
name = "repolens-backend"
version = "0.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Make `import repolens` work without installing the package.
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "e2e: runs the whole pipeline on the reference repository (tests/fixtures/e2e_reference)",
]
