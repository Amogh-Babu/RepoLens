name: Release

# Builds the single RepoLens image (frontend + backend), tests it, and on main
# publishes it to GitHub Container Registry and redeploys the hosted demo.
#
# Pull requests that touch the image build and smoke-test it without
# publishing anything. The deploy step runs only when the repository has a
# DEPLOY_HOOK_URL secret (for example a Render deploy hook URL); without one,
# the image is still published and can be run anywhere with Docker.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'backend/repolens/api/**'
      - 'frontend/package-lock.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build, test, and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Name the image
        id: names
        # Registry names must be lowercase; the repository owner is not.
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/repolens" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Run the backend suite inside the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: repolens:ci
          cache-from: type=gha

      - name: Smoke-test the running container
        run: |
          docker run -d --name repolens -p 8000:8000 repolens:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          # The frontend is served at / and on client-side routes.
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8000/analysis/analysis-000000000000 | grep -q '<div id="root">'
          # The API answers in its contract shape under /api.
          status=$(curl -s -o body.json -w '%{http_code}' http://127.0.0.1:8000/api/analyses/analysis-000000000000)
          test "$status" = 404
          grep -q '"code":"ANALYSIS_NOT_FOUND"' body.json
          # The container runs as a non-root user and its store is on /data.
          test "$(docker exec repolens id -u)" != 0
          docker exec repolens test -f /data/repolens.db

      - name: Show container logs
        if: failure()
        run: docker logs repolens || true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:latest
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      - name: Redeploy the hosted demo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "No DEPLOY_HOOK_URL secret; skipping the deploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy triggered."
