name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.python-version'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.python-version'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same uv as the Docker image; Python comes from .python-version.
  UV_VERSION: '0.13.5'

jobs:
  test:
    # The supported environment: the interpreter pinned in .python-version and
    # the exact dependencies in backend/uv.lock, as in the Docker image.
    name: Test (pinned Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Check the lockfile and exported requirements are current
        run: |
          uv lock --check
          uv export --locked --no-dev --format requirements-txt --no-emit-project -o requirements.txt -q
          uv export --locked --format requirements-txt --no-emit-project -o requirements-dev.txt -q
          git diff --exit-code -- requirements.txt requirements-dev.txt

      - name: Install dependencies
        run: uv sync --locked

      - name: Test (pytest)
        run: uv run --locked python -m pytest -m "not e2e"

  compatibility:
    # RepoLens supports Python 3.11 and up. Run the suite on the oldest
    # supported version and the newest release, with the same locked
    # dependencies, so that claim stays true.
    name: Compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Test (pytest)
        run: uv run --locked python -m pytest -m "not e2e"

  e2e:
    # Runs the whole pipeline (ingest, parse, store, search) on the reference
    # repository in tests/fixtures/e2e_reference and compares every result
    # with its hand-written expected.json, to catch drift between components.
    name: End-to-end (reference repo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: End-to-end test (pytest)
        run: uv run --locked python -m pytest -m e2e -v
