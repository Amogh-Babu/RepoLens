# Run RepoLens with one command:
#
#   docker compose up --build
#
# then open http://localhost:8000. Analyses are kept in the `repolens-data`
# volume, so they survive restarts until they expire (24 hours).
#
# To use the published image instead of building locally:
#
#   docker compose pull && docker compose up
services:
  repolens:
    image: ghcr.io/amogh-babu/repolens:latest
    build: .
    ports:
      - "8000:8000"
    environment:
      # Optional: raises GitHub's API limit of 60 requests an hour.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Optional AI file summaries, off unless enabled with a key. See
      # backend/README.md ("AI File Summaries") and backend/.env.example.
      REPOLENS_AI_ENABLED: ${REPOLENS_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REPOLENS_AI_MODEL: ${REPOLENS_AI_MODEL:-gpt-5.4-mini}
      REPOLENS_AI_TIMEOUT_SECONDS: ${REPOLENS_AI_TIMEOUT_SECONDS:-30}
      REPOLENS_AI_MAX_INPUT_CHARS: ${REPOLENS_AI_MAX_INPUT_CHARS:-40000}
      REPOLENS_AI_MAX_OUTPUT_TOKENS: ${REPOLENS_AI_MAX_OUTPUT_TOKENS:-4096}
      REPOLENS_AI_MAX_CONCURRENT_REQUESTS: ${REPOLENS_AI_MAX_CONCURRENT_REQUESTS:-2}
      REPOLENS_AI_DAILY_CALL_LIMIT: ${REPOLENS_AI_DAILY_CALL_LIMIT:-100}
    volumes:
      - repolens-data:/data
    restart: unless-stopped

volumes:
  repolens-data:
