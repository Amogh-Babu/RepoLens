# Run RepoLens with one command:
#
#   docker compose up --build
#
# then open http://localhost:8000. Analyses are kept in the `repolens-data`
# volume, so they survive restarts until they expire (24 hours).
#
# To use the published image instead of building locally:
#
#   docker compose pull && docker compose up
services:
  repolens:
    image: ghcr.io/amogh-babu/repolens:latest
    build: .
    ports:
      - "8000:8000"
    environment:
      # Optional: raises GitHub's API limit of 60 requests an hour.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Resource limits, shown with their defaults. See
      # docs/system-requirements.md.
      REPOLENS_EMBEDDINGS_ENABLED: ${REPOLENS_EMBEDDINGS_ENABLED:-true}
      REPOLENS_EMBEDDING_THREADS: ${REPOLENS_EMBEDDING_THREADS:-2}
      REPOLENS_EMBEDDING_BATCH_SIZE: ${REPOLENS_EMBEDDING_BATCH_SIZE:-16}
      REPOLENS_MAX_EMBEDDING_CHUNKS: ${REPOLENS_MAX_EMBEDDING_CHUNKS:-10000}
      REPOLENS_MAX_CONCURRENT_ANALYSES: ${REPOLENS_MAX_CONCURRENT_ANALYSES:-1}
    volumes:
      - repolens-data:/data
    restart: unless-stopped

volumes:
  repolens-data:
